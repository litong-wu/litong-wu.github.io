baseURL = 'https://litong-wu.github.io/'
languageCode = 'en-gb'
defaultContentLanguage = 'en-gb'
title = 'Litong Wu'
disableKinds = ['taxonomy', 'term', 'rss']

# hugo-coder config, see
# https://github.com/luizdepra/hugo-coder/blob/main/docs/configurations.md
[params]
author = 'Litong Wu'
altAuthor = '<span lang="zh-cn">吴莉彤</span>'
description = 'Litong Wu’s homepage'
customSCSS = ['scss/custom.scss']

[markup.goldmark.renderer]
unsafe = true

[languages.en-gb]
languageName = 'en' # Display name

[[languages.en-gb.menu.main]]
name = 'Home'
weight = 1
url = '/'

[[languages.en-gb.menu.main]]
name = 'Research'
weight = 2
url = '/research/'

[[languages.en-gb.menu.main]]
name = 'About'
weight = 4
url = '/about/'